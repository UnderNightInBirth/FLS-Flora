def_in_i = Increasable Attacks change properties when you hold their input buttons.
def_vp_n = *6[Vorpal Enhancements]*
def_vp_i = Abilities that are changed during the Vorpal state.


vp_powerup = Improves performance.
vp_powerup_ic = Improves performance for Increase version.
vp_powerup_cs = Improves performance when used directly after Chain Shift.
vp_powerup_cancel = Improves performance when canceled into from a special attack.
vp_chip = Increases chip damage.
vp_chip_sword = Increases chip damage for sword attacks.
vp_chip_blade = Increases chip damage for katana attacks.
vp_bound = Changes how the opponent is knocked back when hit.
vp_enable_grotoair = Allows you to use the midair version before landing after using the ground version.
vp_enable_groto214 = Allows you to use @214+AorBorC@ in midair before landing.
vp_guardok = Keeps set objects around, even after guarding an opponent's attack.
vp_guardok_powerup = Retains the Enhanced state, even after guarding an opponent's attack.
vp_gainexs = Greatly increases EXS Gauge when used.
vp_gainexs_exskill = Greatly increases EXS Gauge when an EX Special Attack is used.
vp_grddrain = Increases GRD absorption.
vp_grdreduce = Increases amount of GRD opponent loses.
vp_range_expand = Allows the move to be activated at a greater distance from the opponent.
vp_enable_whiffcancel = Allows the move to be canceled if it misses.
vp_enable_cancel = Allows you to use the move from a cancel.
vp_reduce_selfdamage = Halves self-inflicted damage.
vp_enable_nocharge = Allows you to activate the move from Mikoruseo without charging.
vp_azhi_cancel = Allows Azhi Dahaka's attacks from an Assault to be canceled.
vp_recover_icon = Restores icon when activated.
vp_havoc = Increases stagger time during Havoc.
vp_no_ukemi = Makes it more difficult to perform Recovery.
vp_sousaiok = Projectiles don't disappear after colliding into another.
vp_enable_skillcancel = Allows the move to be canceled into a special attack upon hit.

