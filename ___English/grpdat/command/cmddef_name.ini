[data]

FLS_rie0 = This is a hit-grab. The @A@ version is the only one that can be cancelled through Chain Shift, CVO, etc./nAll versions have boosted minimum damage outputs, making them powerful at the end of combos./nThe EX version has invulnerability until it becomes active.
FLS_rie1 = The @B@ and /x03 versions provide invincibility on startup.
FLS_rie2 = The increased versions of @A@ and @B@ cause you to run a certain distance.
FLS_riej = Riesbyfe pauses in the air before striking down./nThe button and whether it was increased changes the starting and travelling trajectory./nThe @B@ versions variably make Riesbyfe bounce back on impact.
FLS_rie3 = A series of three punches that can launch the opponent.
FLS_rie4 = You can perform a follow-up after this move lands on your opponent.
FLS_rie5 = The cinematic changes if it lands while on the final clause and is a certain Breakdown.
FLS_rieff = The shield will erase projectiles when timed properly. It is special-cancellable if successful./nThis move can be double-increased if held, having three distinct variations.
FLS_riead = Performs an air-only dodge that makes you invulnerable to attacks until you reach the ground./nYou cannot cancel out of the dodge, and is not impervious to other air throws that the enemy may have.
FLS_rie6b = When timed properly, both variations will erase projectiles and create a counter projectile./nThe regular version only counters when active,/nwhile the increased version has a bigger reflect window.
FLS_rie6c = Cancellable mid-air during Beast Mode.
FLS_riehp = Riesbyfe performs a little hop that will let her cross over the opponent./nYou can especially use this while the opponent is down, as the recovery is low.
FLS_rieBM = Can only be activated by first going into Veil Off or CVO from 200% EXS. Grants Riesbyfe super armor,/nspeed, stagger time, air jump cancels with an additional jump, and changes to her throws and jumping increased @C@./nBeast Mode's timer lasts longer if your HP was lower during activation, and changes when taking or receiving damage.
FLS_rie22 = Can only be performed in Beast Mode. An attack that summons pillars that travel full-screen.

FLS_ing0 = Ingrid throws a projectile. Her hand has an initial hitbox on it./nOnce the projectile is active, Ingrid can control its trajectory by holding any direction./nThe @A@ version only moves horizontally, and @B@ vertically. The @C@ version can move in all directions.
FLS_ing1 = The @B@ and /x03 versions provide invincibility on startup.
FLS_ing2 = Has a follow-up that continues in the air./nCan also cancel into the /x03 version of Sunshine at any time.
FLS_ing4 = Shoots a small, slow-moving bubble. It causes a massive explosion once it hits the opponent./nThe velocity of the bubble changes slightly while holding @4@ or @6@.
FLS_ingiw = An attack that hits everywhere in front of Ingrid.
FLS_ingff = This is a counter move./nIt counters mid and overhead attacks while standing, and mid and low attacks while crouching./nParry the opponent's attack to launch them high and get the timing for a follow-up.
FLS_ing6b = This move is special-cancellable mid-air.

FLS_ryu0 = Shoots a projectile forward that travels horizontally.
FLS_ryu1 = The @B@ and /x03 versions provide invincibility on startup.
FLS_ryu4 = Similar to Tatsumaki Senpukyaku, but moves horizontally through the air depending on the direction you move in./nNeutral and forward jumps will make this move travel forwards,/nwhile jumping backwards will move FLS Ryu backwards.
FLS_ryuiw = A grabbing attack that can only be avoided by jumping.
FLS_ryui2 = FLS Ryu charges up his EXS to deliver a powerful projectile./nThe projectile can NOT be blocked.
FLS_ryuff = Travels forwards, granting projectile invulnerability./nYou can hold @4@ instead to move backwards.

FLS_danff = Dantes moves backwards and disappears, having throw invulnerability during this time./nHe then appears behind the opponent and strikes.
FLS_danfa = Dantes moves backwards in the air and disappears./nHe then appears behind and above the opponent, shooting lasers downwards.


