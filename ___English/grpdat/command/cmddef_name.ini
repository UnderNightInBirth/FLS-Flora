[basic]
sys_n = *2[System Controls]*
sys_i = Controls shared across all characters.

exs_n = *2[EXS Action]*
exs_i = You can perform a unique maneuver by combining a directional input at @D@. /nYou cannot do this during GRD Break.

walf_n = Walk forward
walb_n = Walk backward
walk_i = Hold the @6@ directional button to walk forward and @4@ to walk backward.

croc_n = Crouch
croc_i = Hold the directional button down to crouch./nYou can perform crouching attacks from this position.

jump_n = Jump
jump_i = Press the directional button up to perform a jump./nYou can perform jump attacks while in midair.

dash_n = Dash
dash_i = Press the @6@ directional button twice in quick succession to dash./nContinue running by holding the second @6@ input.

back_n = Backstep
back_i = Press the @4@ directional button twice in quick succession to perform a backstep./nYou are invulnerable at the start of this animation.

guar_n = Guard
guar_i = Guard against your opponent's attacks. Press @4@ to guard while standing and @1@ to guard while crouching./nCertain moves, like projectiles, can be blocked in midair by pressing @1@.

thro_n = Throw
thro_i = Grab and throw your opponent. You can throw opponents that are guarding./nInput @4+A+D@ to throw in the opposite direction.

tech_n = Throw Escape
tech_c = Press @A+D@ the moment your opponent grabs you
tech_i = This will let you escape their throw and nullify its damage.

reco_n = Recovery
reco_c = Hold @AorBorC@ when knocked back
reco_i = Recover after being knocked away./nPress the directional button forward or backwards to change the direction of your recovery.

natk_n = Normal Attacks
natk_i = Perform normal attacks by pressing the @A@, @B@, and @C@ buttons./nIn general, @A@ attacks are weaker, @B@ attacks are of medium strength, and @C@ attacks are strong.

datk_n = Dash Attack
datk_i = Perform a unique attack while dashing.

cons_n = Concentration
cons_c = Hold @D@
cons_i = This increases your GRD gauge while decreasing the opponent's GRD gauge.

assa_n = Assault
assa_i = Lunge forward to close the gap between you and your opponent. You can perform a jump during Assault.

chai_n = Chain Shift
chai_i = Convert GRD to EXS in an invulnerable state./nIt also cancels the previous action, preventing any vulnerable openings.

shie_n = Shield
shie_i = A strong guard that pushes your opponent farther away./nA successful Shield guard will greatly increase your GRD gauge.

pass_n = Passing Link
pass_c = Input all normal attacks in any order
pass_i = You can perform combos by pressing attack buttons in a sequence, such as @A>B>C@./nPerforming a normal attack right as another attack hits will result in a combo. 

smar_n = Smart Steer
smar_c = Continuously tap @A@
smar_i = Continuing to tap @A@ after a standing @A@ attack hits will result in a combo./nYou can directly trigger a finishing move with @A+B@ when the attack hits.

veil_n = Veil Off
veil_i = Unleash your character's powers to temporarily enhance their attributes./nYou'll be invulnerable when you first activate Veil Off, /nand the resulting shockwave can knock your opponent back.

ccvo_n = Cross-Cast Veil Off
ccvo_i = Cancel the previous attack and enter the Veil Off state./nThe resulting shockwave can knock your opponent back and allow you to follow up with additional attacks.

gthr_n = Guard Thrust
gthr_i = Retaliate with an invulnerable attack while guarding./nActivating it will consume the GRD gauge.

incr_n = Increase
incr_c = Hold an attack button after pressing it
incr_i = Charge up an attack to make it stronger./nDifferent characters have different increasable attacks.

gshi_n = Guard Shield
gshi_i = Keep guarding while initiating Shield./nSuccessfully guarding in this state will push your opponent back a significant distance.

dodg_n = Creeping Edge
dodg_i = Approach your opponent while evading their attacks./nPerform this maneuver at close range to circle behind your opponent.

stee_n = Steer Ender
stee_i = Press @A+B@ to unleash a finisher when an attack hits./nIf you activate this right after a combo starts, you'll get bonuses, such as increased GRD.

